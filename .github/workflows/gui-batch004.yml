name: Full GUI recovery batch004 - thirty-two unseen files
on:
  push:
    branches: [validation/auth-gui-batch004-20261103]
permissions:
  contents: read
concurrency:
  group: auth-independent-${{ github.repository }}
  cancel-in-progress: false
jobs:
  gui_batch:
    if: github.repository == 'xue-ding-e/Magpie-Next'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ff997c492a908293dc0de152ee20f83152b88aa9
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Frozen controls, whole inventory and actual cumulative admission
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          echo 'a452db71741a48daa50ed75c612dbd3f237137596e62a32323f930a3dac4a207  .github/gui-batch004/gate.py' | sha256sum -c -
          echo '388d86be9df11c85ead7e7a205caa9ddaf70e2c5b2198976c849705a089c3f3d  .github/gui-batch004/control-hashes.json' | sha256sum -c -
          python3 -I -B .github/gui-batch004/gate.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 3
        with:
          node-version: 22.23.4
      - name: Install integrity-locked README-tested Playwright without scripts
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/magpie-gui-install-home"
          export HOME="$RUNNER_TEMP/magpie-gui-install-home" npm_config_userconfig=/dev/null
          export npm_config_cache="$HOME/npm-cache"
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --prefix .github/gui-batch004
      - name: Install official matched Chromium and WebKit on ephemeral runner
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/magpie-gui-install-home"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/magpie-gui-browsers"
          node .github/gui-batch004/node_modules/playwright/cli.js install --with-deps chromium webkit
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Lightweight process and provenance controls
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.4
          python3 -I -B .github/gui-batch004/selftest.py
      - name: Bounded two-file concurrency, unchanged original engine and language loops
        timeout-minutes: 32
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1860s python3 -I -B .github/gui-batch004/run.py
      - name: Preserve whole827 ledger, archived source evidence and partial files
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gui-batch004-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

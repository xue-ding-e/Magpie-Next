name: Instrumented quota cut diagnostic - not acceptance
on:
  push:
    branches: [validation/auth-quota-cut-diagnostic-20261103]
permissions:
  contents: read
concurrency:
  group: auth-independent-${{ github.repository }}
  cancel-in-progress: false
jobs:
  gui_batch:
    if: github.repository == 'xue-ding-e/Magpie-Next'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ff997c492a908293dc0de152ee20f83152b88aa9
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Frozen single-parent source and diagnostic controls
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          echo '448d55501462fcf7fbe87d7ed27f001928af5c097d2a3175cb10dd2fced434c5  .github/quota-cut/gate.py' | sha256sum -c -
          echo '930396ad1e4ecc71c8806ed851faee4575f49ce5af02e869ce5ee7707b56240e  .github/quota-cut/control-hashes.json' | sha256sum -c -
          python3 -I -B .github/quota-cut/gate.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 3
        with:
          node-version: 22.23.4
      - name: Install integrity-locked README-tested Playwright without scripts
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/magpie-quota-install-home"
          export HOME="$RUNNER_TEMP/magpie-quota-install-home" npm_config_userconfig=/dev/null
          export npm_config_cache="$HOME/npm-cache"
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --prefix .github/quota-cut
      - name: Install official matched Chromium and WebKit on ephemeral runner
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/magpie-quota-install-home"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/magpie-quota-browsers"
          node .github/quota-cut/node_modules/playwright/cli.js install --with-deps chromium webkit
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Lightweight process and provenance controls
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.4
          python3 -I -B .github/quota-cut/selftest.py
      - name: One instrumented original file, two unchanged engine tests
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 145s python3 -I -B .github/quota-cut/run.py
      - name: Preserve instrumented diagnostic and all partial evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quota-cut-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

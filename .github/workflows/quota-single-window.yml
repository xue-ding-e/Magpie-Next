name: Quota single-window unchanged-fixture red green
on:
  push:
    branches: [validation/quota-single-window-20261103]
permissions:
  contents: read
concurrency:
  group: auth-independent-${{ github.repository }}
  cancel-in-progress: false
jobs:
  quota_redgreen:
    if: github.repository == 'xue-ding-e/Magpie-Next'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ff997c492a908293dc0de152ee20f83152b88aa9
          path: base
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: d076db4c3cfaf85fc1def65efbe40936d2c7bf02
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Frozen source, parent, identity and unchanged fixture gate
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          echo '65e048bcd52b3fafcfe6f6a3eef496036d5be14f179bb058a4b09947d3539837  .github/quota-single-window/gate.py' | sha256sum -c -
          echo 'a84ad8b638846c5ccb6ec0abafad4dbde826e8dec8988ec4d047bf4522769b16  .github/quota-single-window/control-hashes.json' | sha256sum -c -
          python3 -I -B .github/quota-single-window/gate.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 3
        with:
          node-version: 22.23.4
      - name: Install locked Playwright without scripts
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/quota-rg-install-home"
          export HOME="$RUNNER_TEMP/quota-rg-install-home" npm_config_userconfig=/dev/null
          export npm_config_cache="$HOME/npm-cache"
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --prefix .github/quota-single-window
      - name: Install official matched Chromium and WebKit
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/quota-rg-install-home"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/quota-rg-browsers"
          node .github/quota-single-window/node_modules/playwright/cli.js install --with-deps chromium webkit
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Lightweight positive and negative controls
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.4
          python3 -I -B .github/quota-single-window/selftest.py
      - name: Sequential required baseline red then candidate green
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1140s python3 -I -B .github/quota-single-window/run.py
      - name: Preserve every completed or partial original fixture result
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quota-single-window-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

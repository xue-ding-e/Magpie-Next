name: Full GUI recovery batch005 - thirty-two unseen files
on:
  push:
    branches: [validation/auth-gui-batch005-20261103]
permissions:
  contents: read
concurrency:
  group: auth-independent-${{ github.repository }}
  cancel-in-progress: false
jobs:
  gui_batch:
    if: github.repository == 'xue-ding-e/Magpie-Next'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ff997c492a908293dc0de152ee20f83152b88aa9
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Frozen controls, whole inventory and actual cumulative admission
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          echo 'ba7e426537451daec1995eb12e893d8b67ef38b623da682118655ef20a8bc4ef  .github/gui-batch005/bootstrap.py' | sha256sum -c -
          echo '878cfb5fbeb3df21aa1688f39581c0656656c1d2121c2c24e22f1de5cd016451  .github/gui-batch005/gate.py' | sha256sum -c -
          echo '275f5f8069327b7506a6714f97c5874eaecdb9e4604f6f43f862f3e10148f7f7  .github/gui-batch005/control-hashes.json' | sha256sum -c -
          python3 -I -B .github/gui-batch005/bootstrap.py
          python3 -I -B .github/gui-batch005/gate.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 3
        with:
          node-version: 22.23.4
      - name: Install integrity-locked README-tested Playwright without scripts
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/magpie-gui-install-home"
          export HOME="$RUNNER_TEMP/magpie-gui-install-home" npm_config_userconfig=/dev/null
          export npm_config_cache="$HOME/npm-cache"
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --prefix .github/gui-batch005
      - name: Install official matched Chromium and WebKit on ephemeral runner
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/magpie-gui-install-home"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/magpie-gui-browsers"
          node .github/gui-batch005/node_modules/playwright/cli.js install --with-deps chromium webkit
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Lightweight process and provenance controls
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.23.4
          python3 -I -B .github/gui-batch005/bootstrap-selftest.py
          python3 -I -B .github/gui-batch005/selftest.py
      - name: Bounded two-file concurrency, unchanged original engine and language loops
        timeout-minutes: 32
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1860s python3 -I -B .github/gui-batch005/run.py
      - name: Preserve whole827 ledger, archived source evidence and partial files
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gui-batch005-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

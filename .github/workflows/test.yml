name: Test

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed validation commit (40 lowercase hex characters)
        required: true
        type: string

# Validation branch only. Never merge this harness into the product branch.
# Reuse the existing repository-wide Test queue without cancelling active runs.
concurrency:
  group: test-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  budget-window-validation:
    if: >-
      github.repository == 'xue-ding-e/Magpie-Next' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/validation/budget-window-20261024' &&
      github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GOTOOLCHAIN: local
    steps:
      - name: Checkout the exact reviewed validation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 2
          persist-credentials: false

      # Toolchain acquisition is online setup, not an offline test result.
      - name: Set up official Go 1.26.10
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        timeout-minutes: 3
        with:
          go-version: '1.26.10'
          check-latest: false
          cache: false

      # Includes bounded module acquisition. No apt, bun, GUI, full suite,
      # race, application build, release, publication, or credential input.
      - name: Supervise behavioral RED and focused GREEN
        timeout-minutes: 10
        run: python3 -I -B build/budget_window_validation.py

      # Only synthetic test/check output, never HOME, caches, binaries, or
      # overlay input. Runner loss or hard job timeout may preempt cleanup.
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 1
        with:
          name: budget-window-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/budget-window-evidence/
          if-no-files-found: warn
          retention-days: 14

name: Test

on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Exact reviewed candidate SHA (required for native local projection control)
        required: true
        type: string
  workflow_call:

# Next release builds call this validation before packaging. Manual validation
# remains available; one full matrix runs at a time without cancellation.
concurrency:
  group: test-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

# Match the toolchain selected from go.mod rather than silently changing it.
env:
  GOTOOLCHAIN: local

# Keep complete step logs without letting tee turn a failed check green.
defaults:
  run:
    shell: bash build/ci-step.sh {0}

jobs:
  native-local-projection:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'xue-ding-e/Magpie-Next' && github.ref == 'refs/heads/validation/native-local-projection-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify reviewed dispatch identity
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_CONTROL_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_control_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 970111f6cb62cc02fe36a82ea7d71b37a2889c97
          path: .native-codex
          persist-credentials: false
      - name: Fixed source, exact candidate files and owned synthetic roots
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = da3951b9b251293df31aa668a3d7c2caa318aab6
          test "$(git -C .native-codex rev-parse HEAD)" = 970111f6cb62cc02fe36a82ea7d71b37a2889c97
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('build/native-materialization')
          hashes=json.loads((root/'source-hashes.json').read_text())
          assert len(hashes)==21
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual==set(hashes)|{'source-hashes.json'}
          for name,digest in hashes.items():
              p=root/name
              assert not p.is_symlink() and p.resolve()==root.resolve()/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
          expected={f'build/native-materialization/{name}' for name in actual}|{'.github/workflows/test.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert changed==expected,(changed,expected)
          # Frozen independent source-review identities, not regenerated expected values.
          assert hashes['magpie_local_projection_contract.rs']=='2738d214383e3b85ee9458c3e278bf709a28cacfc993949655b6070355437495'
          assert hashes['audit-local-projection.py']=='d00067c5bb06f041ef8f9b24489fa295810098d27bcd6b4395ea79fdc3965a90'
          assert hashes['magpie_reference_hashes.json']=='ebea789f530fa5a3d49e55210b02b976361ef240f7ff42b03a2e9f0834ce325e'
          PYCODE
          owned="$RUNNER_TEMP/native-local-projection-owned"
          mkdir "$owned"
          for name in home config cache data tmp cargo rustup target evidence; do mkdir "$owned/$name"; done
          cp -a build/native-materialization/golden "$owned/golden"
          {
            echo "MAGPIE_OWNED_ROOT=$owned"
            echo "EVIDENCE=$owned/evidence"
            echo "MAGPIE_SOURCE=$GITHUB_WORKSPACE"
            echo "CODEX_SOURCE=$GITHUB_WORKSPACE/.native-codex"
            echo "MAGPIE_GOLDEN_INPUT=$owned/golden"
            echo "MAGPIE_MATERIALIZATION_OUTPUT=$owned/event-rich"
            echo "RUSTUP_BIN=$(command -v rustup)"
          } >> "$GITHUB_ENV"
          printf 'magpie=%s\ncodex=%s\n' "$GITHUB_SHA" 970111f6cb62cc02fe36a82ea7d71b37a2889c97 > "$owned/evidence/source"
          cp build/native-materialization/source-hashes.json "$owned/evidence/reviewed-source-hashes.json"
      - name: Bounded public dependency preparation and target-only compilation
        timeout-minutes: 60
        run: |
          set -euo pipefail
          printf 'setup-public-dependencies-and-target-compilation\n' > "$EVIDENCE/stage"
          test "$(df --output=avail -k "$RUNNER_TEMP" | tail -1)" -ge 16777216
          for tool in pkg-config cc cmake perl setpriv unshare ip; do command -v "$tool"; done
          # Check namespace support before spending the compilation budget. No fallback.
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups env -i PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin bash -c 'test "$(ip -o link show | wc -l)" = 1'
          python3 build/native-materialization/audit-dependencies.py "$CODEX_SOURCE" > "$EVIDENCE/dependency-audit.json"
          cp "$CODEX_SOURCE/LICENSE" "$EVIDENCE/CODEX-LICENSE"
          cp "$CODEX_SOURCE/NOTICE" "$EVIDENCE/CODEX-NOTICE"
          owned="$MAGPIE_OWNED_ROOT"
          # Toolchain and Cargo caches are this run's own. No user registry/SSH credentials.
          timeout 4m env -i HOME="$owned/home" PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin TMPDIR="$owned/tmp" CARGO_HOME="$owned/cargo" RUSTUP_HOME="$owned/rustup" "$RUSTUP_BIN" toolchain install 1.99.1 --profile minimal
          cargo_bin=$(env -i HOME="$owned/home" PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin CARGO_HOME="$owned/cargo" RUSTUP_HOME="$owned/rustup" "$RUSTUP_BIN" which --toolchain 1.99.1 cargo)
          safe_path="$(dirname "$cargo_bin"):/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          test -x "$cargo_bin"
          echo "SAFE_PATH=$safe_path" >> "$GITHUB_ENV"
          env -i HOME="$owned/home" PATH="$safe_path" rustc --version | tee "$EVIDENCE/rust-version"
          mkdir -p "$CODEX_SOURCE/codex-rs/thread-store/tests"
          test ! -e "$CODEX_SOURCE/codex-rs/thread-store/tests/magpie_local_projection_contract.rs"
          test ! -e "$CODEX_SOURCE/codex-rs/thread-store/tests/magpie_reference_hashes.json"
          cp build/native-materialization/magpie_local_projection_contract.rs "$CODEX_SOURCE/codex-rs/thread-store/tests/"
          cp build/native-materialization/magpie_reference_hashes.json "$CODEX_SOURCE/codex-rs/thread-store/tests/"
          # ONLINE preparation executes locked dependency build.rs/procedural macros.
          # Only actual tests below are network-isolated. Never fetch/build the whole workspace.
          (cd "$CODEX_SOURCE/codex-rs" && timeout 45m env -i HOME="$owned/home" CODEX_HOME="$owned/home" XDG_CONFIG_HOME="$owned/config" XDG_CACHE_HOME="$owned/cache" XDG_DATA_HOME="$owned/data" TMPDIR="$owned/tmp" PATH="$safe_path" CARGO_HOME="$owned/cargo" RUSTUP_HOME="$owned/rustup" CARGO_TARGET_DIR="$owned/target" CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_INCREMENTAL=0 LANG=C.UTF-8 cargo test --locked -p codex-thread-store --test magpie_local_projection_contract --no-run) 2>&1 | tee "$EVIDENCE/prepare-compile.log"
          git diff --exit-code
          git -C "$CODEX_SOURCE" diff --exit-code
      - name: Offline real local writer, SQLite projection and four-revision lineage
        timeout-minutes: 20
        run: |
          set -euo pipefail
          owned="$MAGPIE_OWNED_ROOT"
          # Only this step is no-network; reset credentials/environment rather than sudo -E.
          # The target supplies non-Git synthetic metadata.cwd; no provider manager is called.
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups env -i HOME="$owned/home" CODEX_HOME="$owned/home" XDG_CONFIG_HOME="$owned/config" XDG_CACHE_HOME="$owned/cache" XDG_DATA_HOME="$owned/data" TMPDIR="$owned/tmp" PATH="$SAFE_PATH" CARGO_HOME="$owned/cargo" RUSTUP_HOME="$owned/rustup" CARGO_TARGET_DIR="$owned/target" CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 CARGO_INCREMENTAL=0 LANG=C.UTF-8 MAGPIE_OWNED_ROOT="$owned" MAGPIE_SOURCE="$MAGPIE_SOURCE" CODEX_SOURCE="$CODEX_SOURCE" EVIDENCE="$EVIDENCE" MAGPIE_GOLDEN_INPUT="$MAGPIE_GOLDEN_INPUT" MAGPIE_MATERIALIZATION_OUTPUT="$MAGPIE_MATERIALIZATION_OUTPUT" bash build/native-materialization/validate-offline.sh
      - name: Collect only bounded generated synthetic files, including partial failures
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os,pathlib,shutil
          temp=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          owned=temp/'native-local-projection-owned'
          if owned.exists():
              assert not owned.is_symlink() and owned.resolve().parent==temp
              source=owned/'event-rich'
              if source.exists():
                  assert source.is_dir() and not source.is_symlink() and source.resolve().parent==owned
                  allowed={f'{v}/{p}/{r}.jsonl' for v in ('shrink','grow') for p in ('before','after') for r in 'ABCD'}|{'manifest.json'}
                  entries=list(source.rglob('*'))
                  assert all(not p.is_symlink() for p in entries)
                  files=[p for p in entries if not p.is_dir()]
                  assert len(files)<=17
                  for p in files:
                      relative=p.relative_to(source)
                      assert p.is_file() and not p.is_symlink() and p.resolve()==source/relative
                      assert relative.as_posix() in allowed and p.stat().st_size<=131072
                      target=owned/'evidence'/'event-rich'/relative
                      target.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(p,target)
          PYCODE
      - name: Preserve stage and bounded synthetic evidence, never caches or databases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-local-projection-${{ github.sha }}
          path: ${{ runner.temp }}/native-local-projection-owned/evidence
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup only owned synthetic directories
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os,pathlib,shutil
          temp=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          work=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          for parent,name in [(temp,'native-local-projection-owned'),(work,'.native-codex')]:
              p=parent/name
              if p.is_symlink(): raise RuntimeError('refuse symlink cleanup')
              if p.exists():
                  if not p.is_dir() or p.resolve().parent!=parent: raise RuntimeError('unexpected cleanup target')
                  shutil.rmtree(p)
          PYCODE


  test:
    if: github.ref != 'refs/heads/validation/native-local-projection-20261031'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Check CI log wrapper
        timeout-minutes: 1
        run: bash build/ci-step_test.sh

      - name: Check isolated-home cleanup
        timeout-minutes: 1
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home_test.py

      - uses: actions/setup-go@v5
        timeout-minutes: 10
        with:
          go-version-file: go.mod

      # The GUI links GTK 3 and WebKitGTK 4.1 through cgo on Linux (see the
      # Makefile), so vet and test need their headers and the gtk3 tag.
      # A stuck apt mirror held main's run here for 2.5 hours (b0d456c3), and
      # every later push queued behind it; it takes under a minute.
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Tags
        timeout-minutes: 1
        id: tags
        run: |
          if [ "$RUNNER_OS" = Linux ]; then echo "tags=gtk3" >> "$GITHUB_OUTPUT"; fi

      # Unformatted files reached main 8 times from 10-01 to 10-06 and each
      # took a gofmt commit of its own. Linux only: Windows checks out CRLF.
      - name: Gofmt
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi

      - name: Vet
        timeout-minutes: 60
        run: go vet -tags "${{ steps.tags.outputs.tags }}" ./...

      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: 1.4.2

      # Acceptance criterion 2: retain the populated caches outside the test
      # home. TestMain still supplies its agent-variable/keychain stand-ins.
      # Cleanup uses this step's recorded path and identity, never mutable HOME.
      - name: Isolate test home
        id: test_home
        timeout-minutes: 2
        run: |
          gopath=$(go env GOPATH)
          modcache=$(go env GOMODCACHE)
          buildcache=$(go env GOCACHE)
          {
            echo "GOPATH=$gopath"
            echo "GOMODCACHE=$modcache"
            echo "GOCACHE=$buildcache"
          } >> "$GITHUB_ENV"
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home.py create
          git rev-parse HEAD
          go version
          bun --version

      # Acceptance criterion 3 also requires a linked native application.
      - name: Build native application
        timeout-minutes: 60
        run: go build -tags "${{ steps.tags.outputs.tags }}" -o "$RUNNER_TEMP/magpie-native" .

      # LESSONS gives slow packages 45 minutes; the outer step remains bounded.
      - name: Test
        timeout-minutes: 60
        if: runner.os != 'Windows'
        run: go test -count=1 -timeout 45m -tags "${{ steps.tags.outputs.tags }}" ./...

      # Windows skips the Test step above, so the two plugin stderr tests run
      # here. The end-to-end one needs bun on PATH; without it it skips.
      - name: Plugin stderr tests (Windows)
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: |
          bun --version
          go test -v -count=1 -timeout 10m ./internal/plugin/ -run '^(TestHostStartsPastAnOverlongStderrLine|TestDrainStderrKeepsTheChildGoing)$'

      - name: Production plugin flow
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          MAGPIE_FLOW_BIG: '1'
        run: |
          bun --version
          go test -timeout 10m -tags "${{ steps.tags.outputs.tags }}" ./internal/plugin/... -run '^TestFlowBigReplyProd$' -count=1

      # The redaction tests reuse this binary in fresh processes to check
      # first-use races, so it must include the race detector. The gateway's
      # tests can't call t.Parallel (t.Setenv), so its suite runs split over
      # one process per core (#923); each process isolates its own home.
      - name: Race
        timeout-minutes: 60
        if: runner.os != 'Windows'
        run: |
          go test -race -c -o "$RUNNER_TEMP/gateway.race" -tags "${{ steps.tags.outputs.tags }}" ./internal/gateway/
          build/race-shards.sh internal/gateway "$RUNNER_TEMP/gateway.race" "$(getconf _NPROCESSORS_ONLN)" -test.timeout=20m
          go test -race -count=1 -timeout 10m -tags "${{ steps.tags.outputs.tags }}" ./internal/redact/

      # Account usage mixes cached results with concurrent fetches.
      - name: Race account usage
        timeout-minutes: 15
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout 10m -tags "${{ steps.tags.outputs.tags }}" ./internal/provider/ -run '^Test(LoginUsage|SubscriptionUsageEachAccount)'

      # Some tests fake a home through $HOME, which Windows doesn't read
      # (USERPROFILE), or assume Unix file modes. Compile the full suite
      # on Windows and run the isolated native checks below.
      - name: Compile tests
        timeout-minutes: 30
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 10m -run '^$' ./...

      # These checks use in-memory errors and loopback test servers. Run
      # the native Winsock refusal case rather than only compiling it.
      - name: Windows MCP health
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 2m ./internal/library -run '^(TestNetHealth|TestCheckHTTP)$'

      # Usage isolates USERPROFILE and the agent homes; execute its native
      # ChangeTime checks rather than only cross-compiling the Windows API.
      - name: Windows usage cache
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 10m ./internal/usage -run '^(TestWindows|TestLogChange|TestLogFileInfoPreservesIdentity$|TestUsageSameSizeAndMtimeRewrite$|TestLogGrowingRewriteThenAppend$|TestUsagePageCacheAfterUncachedQuery$)'

      # Install tests keep their files in t.TempDir; exercise real Windows
      # executable and held-handle rename/rollback behavior, and the trial
      # start before the install (#2272).
      - name: Windows update install
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 2m ./internal/update -run '^(TestInstallBinary|TestMoveAside|TestTrialStart)'

      # These tests use temporary paths, without the Unix HOME assumptions
      # of the full suite. Run the native link-kind and sharing-error checks,
      # and the Codex copy checks that read NTFS ChangeTime (#1299).
      - name: Windows session moves
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: |
          # Exact synthetic names; preserve the existing native Windows selection.
          synthetic='^(TestRolloutBoundaryPlanBytes|TestRolloutBoundaryPlanDescendant|TestRolloutBoundaryPlanCutoffPair|TestRolloutBoundaryPlanRejectsInvalidIdentity|TestRolloutBoundaryPlanRejects|TestRolloutGraphOrder|TestRolloutGraphRejects|TestRolloutGraphDeepChain|TestRolloutPlanOrdersBoundaryRewrites|TestReferenceRewriteConserves|TestReferenceRewriteRejectsChanges|TestReferenceRewriteRejectsConservedInvalidShape|TestReferenceRewriteResourceSubset|TestReferenceRewriteDoesNotConflateInvalidEscapes|TestStagedReferencePlanBindsImmutableRevisions|TestStagedReferencePlanRejectsWrongParentMap|TestStagedReferencePlanRejects|TestSyntheticSnapshotInventory|TestSyntheticSnapshotEmptyRoots|TestSyntheticSnapshotReadBounds|TestSyntheticSnapshotRejectsDotEntry|TestSyntheticSnapshotRejectsStaleChildMetadataOrdinal|TestSyntheticSnapshotRejectsConservedInvalidUTF8|TestSyntheticSnapshotResultDoesNotRetainInputs|TestSyntheticSnapshotInitialOrdinalBoundary|TestSyntheticCompactionPreviewReferenceComposition)$'
          go test -v -count=1 -timeout 10m ./internal/sessions -run "^Test(WindowsSession|Move|CopyAll|CodexArchived|CodexSameTick|CodexPlainTwin)|${synthetic}"

      # dsh's layered config is read and edited in temporary homes. Run
      # these checks on Windows too, including Desktop's home patch layer.
      - name: Windows dsh configuration
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 10m ./internal/agent -run '^Test(Dsh|KeepDsh)'

      - name: Windows VS Code detection
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 10m ./internal/agent -run '^TestVSCodeDetected$'

      # On a step failure/cancellation, remove only the home created above.
      # A lost runner or job-level hard timeout may preempt cleanup/upload.
      - name: Clean isolated test home
        if: ${{ always() && steps.test_home.outputs.record != '' }}
        timeout-minutes: 2
        env:
          MAGPIE_CI_HOME_RECORD: ${{ steps.test_home.outputs.record }}
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home.py cleanup

      # Workflow logs remain available if a runner is lost before upload.
      # Only check output is retained, not homes, caches, or build products.
      - name: Preserve check logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magpie-ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7

  cli:
    name: cli (${{ matrix.goos }}/${{ matrix.goarch }}, nogui)
    needs: test
    # Preserve independent CLI/site evidence after test failures, not cancellation.
    if: ${{ !cancelled() && github.ref != 'refs/heads/validation/native-local-projection-20261031' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: android
            goarch: arm64
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        timeout-minutes: 10
        with:
          go-version-file: go.mod
      - name: Build the terminal-only release
        timeout-minutes: 20
        env:
          CGO_ENABLED: '0'
        run: make release-cli TARGETS="${{ matrix.goos }}/${{ matrix.goarch }}"
      - uses: oven-sh/setup-bun@v2
        if: matrix.goos == 'linux'
        timeout-minutes: 5
        with:
          bun-version: 1.4.2

      # Acceptance criterion 2: retain the populated caches outside the test
      # home. TestMain still supplies its agent-variable/keychain stand-ins.
      # Cleanup uses this step's recorded path and identity, never mutable HOME.
      - name: Isolate test home
        id: test_home
        if: matrix.goos == 'linux'
        timeout-minutes: 2
        run: |
          gopath=$(go env GOPATH)
          modcache=$(go env GOMODCACHE)
          buildcache=$(go env GOCACHE)
          {
            echo "GOPATH=$gopath"
            echo "GOMODCACHE=$modcache"
            echo "GOCACHE=$buildcache"
          } >> "$GITHUB_ENV"
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home.py create
          git rev-parse HEAD
          go version
          bun --version

      # Acceptance criterion 3: vet compiles tests too; build alone does not.
      - name: Vet terminal-only packages
        if: matrix.goos == 'linux'
        timeout-minutes: 20
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: go vet -tags nogui ./...

      - name: Test terminal-only packages
        if: matrix.goos == 'linux'
        timeout-minutes: 60
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: go test -count=1 -timeout 45m -tags nogui ./...

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        if: matrix.goos == 'linux'
        with:
          node-version: 22
      - name: Test the site and installer
        timeout-minutes: 10
        if: matrix.goos == 'linux'
        run: |
          sh -n site/public/install.sh
          node --test site/*.test.mjs

      # On a step failure/cancellation, remove only the home created above.
      # A lost runner or job-level hard timeout may preempt cleanup/upload.
      - name: Clean isolated test home
        if: ${{ always() && steps.test_home.outputs.record != '' }}
        timeout-minutes: 2
        env:
          MAGPIE_CI_HOME_RECORD: ${{ steps.test_home.outputs.record }}
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home.py cleanup

      # Workflow logs remain available if a runner is lost before upload.
      # Only check output is retained, not homes, caches, or build products.
      - name: Preserve check logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magpie-ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7

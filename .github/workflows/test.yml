name: Test

on:
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Exact reviewed candidate SHA (required for legacy marker control)
        required: true
        type: string
  workflow_call:

# Next release builds call this validation before packaging. Manual validation
# remains available; one full matrix runs at a time without cancellation.
concurrency:
  group: test-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

# Match the toolchain selected from go.mod rather than silently changing it.
env:
  GOTOOLCHAIN: local

# Keep complete step logs without letting tee turn a failed check green.
defaults:
  run:
    shell: bash build/ci-step.sh {0}

jobs:
  legacy-marker-characterization:
    # Candidate-only test control: never a release or native Codex migration claim.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'xue-ding-e/Magpie-Next' && github.ref == 'refs/heads/validation/legacy-marker-characterization-20261031'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOMAXPROCS: '2'
      CGO_ENABLED: '0'
    steps:
      - name: Verify reviewed dispatch identity before checkout
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_CONTROL_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_control_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify candidate and isolate synthetic home
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --count --merges d65e4026f0856215a35232fabc4cbb3f98fa52d7..HEAD)" = 0
          git merge-base --is-ancestor d65e4026f0856215a35232fabc4cbb3f98fa52d7 HEAD
          git diff --name-only d65e4026f0856215a35232fabc4cbb3f98fa52d7 HEAD > "$RUNNER_TEMP/changed-paths"
          printf '%s\n' '.github/workflows/test.yml' 'internal/sessions/codex_portable_legacy_status_test.go' > "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/changed-paths"
          mkdir -p "$RUNNER_TEMP/legacy-evidence" "$RUNNER_TEMP/synthetic-home" "$RUNNER_TEMP/legacy-test-tmp"
          printf 'head=%s\ntree=%s\nbase=%s\ntest_blob=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" d65e4026f0856215a35232fabc4cbb3f98fa52d7 "$(git rev-parse HEAD:internal/sessions/codex_portable_legacy_status_test.go)" > "$RUNNER_TEMP/legacy-evidence/source.txt"
          for key in GOPATH GOMODCACHE GOCACHE; do echo "$key=$(go env "$key")" >> "$GITHUB_ENV"; done
          for key in HOME USERPROFILE XDG_CONFIG_HOME XDG_CACHE_HOME XDG_DATA_HOME XDG_STATE_HOME APPDATA LOCALAPPDATA; do echo "$key=$RUNNER_TEMP/synthetic-home" >> "$GITHUB_ENV"; done
          echo "TMPDIR=$RUNNER_TEMP/legacy-test-tmp" >> "$GITHUB_ENV"
      - name: Run only selected synthetic sessions tests
        timeout-minutes: 20
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/sessions/codex_portable_legacy_status_test.go)"
          go test -mod=readonly -p=2 -tags nogui -count=1 -timeout=8m -json -run '^Test(PortSyntheticLegacyMarkersScope|PortLineLeavesOthers|PortCodexRolloutsLeavesAnOpenThread)$' ./internal/sessions | tee "$RUNNER_TEMP/legacy-evidence/tests.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          events = [json.loads(s) for s in (Path(os.environ['RUNNER_TEMP']) / 'legacy-evidence/tests.jsonl').read_text().splitlines()]
          expected = {'TestPortSyntheticLegacyMarkersScope', 'TestPortLineLeavesOthers', 'TestPortCodexRolloutsLeavesAnOpenThread'}
          passed = {e['Test'] for e in events if e.get('Action') == 'pass' and 'Test' in e and '/' not in e['Test']}
          assert passed == expected, (passed, expected)
          assert not any(e.get('Action') in {'skip', 'fail'} for e in events)
          for variant in ('plain', 'zstd'):
              assert any(e.get('Action') == 'pass' and e.get('Test') == 'TestPortSyntheticLegacyMarkersScope/' + variant for e in events)
          assert any(e.get('Action') == 'pass' and e.get('Package') == 'github.com/yetone/magpie/internal/sessions' and 'Test' not in e for e in events)
          print('Three selected top-level tests and both marker fixture variants passed; native resume not tested.')
          PY
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Clean only candidate-owned synthetic directories
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          for name in ('synthetic-home', 'legacy-test-tmp'):
              path = root / name
              if path.is_symlink():
                  raise RuntimeError('Refusing symlink cleanup root: ' + str(path))
              if path.exists():
                  if path.resolve(strict=True).parent != root or not path.is_dir():
                      raise RuntimeError('Unexpected cleanup target: ' + str(path))
                  shutil.rmtree(path)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-marker-characterization-${{ github.sha }}
          path: ${{ runner.temp }}/legacy-evidence
          if-no-files-found: error
          retention-days: 7
  test:
    if: github.ref != 'refs/heads/validation/legacy-marker-characterization-20261031'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Check CI log wrapper
        timeout-minutes: 1
        run: bash build/ci-step_test.sh

      - name: Check isolated-home cleanup
        timeout-minutes: 1
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home_test.py

      - uses: actions/setup-go@v5
        timeout-minutes: 10
        with:
          go-version-file: go.mod

      # The GUI links GTK 3 and WebKitGTK 4.1 through cgo on Linux (see the
      # Makefile), so vet and test need their headers and the gtk3 tag.
      # A stuck apt mirror held main's run here for 2.5 hours (b0d456c3), and
      # every later push queued behind it; it takes under a minute.
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Tags
        timeout-minutes: 1
        id: tags
        run: |
          if [ "$RUNNER_OS" = Linux ]; then echo "tags=gtk3" >> "$GITHUB_OUTPUT"; fi

      # Unformatted files reached main 8 times from 10-01 to 10-06 and each
      # took a gofmt commit of its own. Linux only: Windows checks out CRLF.
      - name: Gofmt
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi

      - name: Vet
        timeout-minutes: 20
        run: go vet -tags "${{ steps.tags.outputs.tags }}" ./...

      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: 1.4.2

      # Acceptance criterion 2: retain the populated caches outside the test
      # home. TestMain still supplies its agent-variable/keychain stand-ins.
      # Cleanup uses this step's recorded path and identity, never mutable HOME.
      - name: Isolate test home
        id: test_home
        timeout-minutes: 2
        run: |
          gopath=$(go env GOPATH)
          modcache=$(go env GOMODCACHE)
          buildcache=$(go env GOCACHE)
          {
            echo "GOPATH=$gopath"
            echo "GOMODCACHE=$modcache"
            echo "GOCACHE=$buildcache"
          } >> "$GITHUB_ENV"
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home.py create
          git rev-parse HEAD
          go version
          bun --version

      # Acceptance criterion 3 also requires a linked native application.
      - name: Build native application
        timeout-minutes: 20
        run: go build -tags "${{ steps.tags.outputs.tags }}" -o "$RUNNER_TEMP/magpie-native" .

      # LESSONS gives slow packages 45 minutes; the outer step remains bounded.
      - name: Test
        timeout-minutes: 60
        if: runner.os != 'Windows'
        run: go test -count=1 -timeout 45m -tags "${{ steps.tags.outputs.tags }}" ./...

      # Windows skips the Test step above, so the two plugin stderr tests run
      # here. The end-to-end one needs bun on PATH; without it it skips.
      - name: Plugin stderr tests (Windows)
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: |
          bun --version
          go test -v -count=1 -timeout 10m ./internal/plugin/ -run '^(TestHostStartsPastAnOverlongStderrLine|TestDrainStderrKeepsTheChildGoing)$'

      - name: Production plugin flow
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          MAGPIE_FLOW_BIG: '1'
        run: |
          bun --version
          go test -timeout 10m -tags "${{ steps.tags.outputs.tags }}" ./internal/plugin/... -run '^TestFlowBigReplyProd$' -count=1

      # The redaction tests reuse this binary in fresh processes to check
      # first-use races, so it must include the race detector. The gateway's
      # tests can't call t.Parallel (t.Setenv), so its suite runs split over
      # one process per core (#923); each process isolates its own home.
      - name: Race
        timeout-minutes: 60
        if: runner.os != 'Windows'
        run: |
          go test -race -c -o "$RUNNER_TEMP/gateway.race" -tags "${{ steps.tags.outputs.tags }}" ./internal/gateway/
          build/race-shards.sh internal/gateway "$RUNNER_TEMP/gateway.race" "$(getconf _NPROCESSORS_ONLN)" -test.timeout=20m
          go test -race -count=1 -timeout 10m -tags "${{ steps.tags.outputs.tags }}" ./internal/redact/

      # Account usage mixes cached results with concurrent fetches.
      - name: Race account usage
        timeout-minutes: 15
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout 10m -tags "${{ steps.tags.outputs.tags }}" ./internal/provider/ -run '^Test(LoginUsage|SubscriptionUsageEachAccount)'

      # Some tests fake a home through $HOME, which Windows doesn't read
      # (USERPROFILE), or assume Unix file modes. Compile the full suite
      # on Windows and run the isolated native checks below.
      - name: Compile tests
        timeout-minutes: 30
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 10m -run '^$' ./...

      # These checks use in-memory errors and loopback test servers. Run
      # the native Winsock refusal case rather than only compiling it.
      - name: Windows MCP health
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 2m ./internal/library -run '^(TestNetHealth|TestCheckHTTP)$'

      # Usage isolates USERPROFILE and the agent homes; execute its native
      # ChangeTime checks rather than only cross-compiling the Windows API.
      - name: Windows usage cache
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 10m ./internal/usage -run '^(TestWindows|TestLogChange|TestLogFileInfoPreservesIdentity$|TestUsageSameSizeAndMtimeRewrite$|TestLogGrowingRewriteThenAppend$|TestUsagePageCacheAfterUncachedQuery$)'

      # Install tests keep their files in t.TempDir; exercise real Windows
      # executable and held-handle rename/rollback behavior, and the trial
      # start before the install (#2272).
      - name: Windows update install
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 2m ./internal/update -run '^(TestInstallBinary|TestMoveAside|TestTrialStart)'

      # These tests use temporary paths, without the Unix HOME assumptions
      # of the full suite. Run the native link-kind and sharing-error checks,
      # and the Codex copy checks that read NTFS ChangeTime (#1299).
      - name: Windows session moves
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: |
          # Exact synthetic names; preserve the existing native Windows selection.
          synthetic='^(TestRolloutBoundaryPlanBytes|TestRolloutBoundaryPlanDescendant|TestRolloutBoundaryPlanCutoffPair|TestRolloutBoundaryPlanRejectsInvalidIdentity|TestRolloutBoundaryPlanRejects|TestRolloutGraphOrder|TestRolloutGraphRejects|TestRolloutGraphDeepChain|TestRolloutPlanOrdersBoundaryRewrites|TestReferenceRewriteConserves|TestReferenceRewriteRejectsChanges|TestReferenceRewriteRejectsConservedInvalidShape|TestReferenceRewriteResourceSubset|TestReferenceRewriteDoesNotConflateInvalidEscapes|TestStagedReferencePlanBindsImmutableRevisions|TestStagedReferencePlanRejectsWrongParentMap|TestStagedReferencePlanRejects|TestSyntheticSnapshotInventory|TestSyntheticSnapshotEmptyRoots|TestSyntheticSnapshotReadBounds|TestSyntheticSnapshotRejectsDotEntry|TestSyntheticSnapshotRejectsStaleChildMetadataOrdinal|TestSyntheticSnapshotRejectsConservedInvalidUTF8|TestSyntheticSnapshotResultDoesNotRetainInputs|TestSyntheticSnapshotInitialOrdinalBoundary|TestSyntheticCompactionPreviewReferenceComposition)$'
          go test -v -count=1 -timeout 10m ./internal/sessions -run "^Test(WindowsSession|Move|CopyAll|CodexArchived|CodexSameTick|CodexPlainTwin)|${synthetic}"

      # dsh's layered config is read and edited in temporary homes. Run
      # these checks on Windows too, including Desktop's home patch layer.
      - name: Windows dsh configuration
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 10m ./internal/agent -run '^Test(Dsh|KeepDsh)'

      - name: Windows VS Code detection
        timeout-minutes: 15
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout 10m ./internal/agent -run '^TestVSCodeDetected$'

      # On a step failure/cancellation, remove only the home created above.
      # A lost runner or job-level hard timeout may preempt cleanup/upload.
      - name: Clean isolated test home
        if: ${{ always() && steps.test_home.outputs.record != '' }}
        timeout-minutes: 2
        env:
          MAGPIE_CI_HOME_RECORD: ${{ steps.test_home.outputs.record }}
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home.py cleanup

      # Workflow logs remain available if a runner is lost before upload.
      # Only check output is retained, not homes, caches, or build products.
      - name: Preserve check logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magpie-ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7

  cli:
    name: cli (${{ matrix.goos }}/${{ matrix.goarch }}, nogui)
    needs: test
    # Preserve independent CLI/site evidence after test failures, not cancellation.
    if: ${{ !cancelled() && github.ref != 'refs/heads/validation/legacy-marker-characterization-20261031' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: android
            goarch: arm64
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        timeout-minutes: 10
        with:
          go-version-file: go.mod
      - name: Build the terminal-only release
        timeout-minutes: 20
        env:
          CGO_ENABLED: '0'
        run: make release-cli TARGETS="${{ matrix.goos }}/${{ matrix.goarch }}"
      - uses: oven-sh/setup-bun@v2
        if: matrix.goos == 'linux'
        timeout-minutes: 5
        with:
          bun-version: 1.4.2

      # Acceptance criterion 2: retain the populated caches outside the test
      # home. TestMain still supplies its agent-variable/keychain stand-ins.
      # Cleanup uses this step's recorded path and identity, never mutable HOME.
      - name: Isolate test home
        id: test_home
        if: matrix.goos == 'linux'
        timeout-minutes: 2
        run: |
          gopath=$(go env GOPATH)
          modcache=$(go env GOMODCACHE)
          buildcache=$(go env GOCACHE)
          {
            echo "GOPATH=$gopath"
            echo "GOMODCACHE=$modcache"
            echo "GOCACHE=$buildcache"
          } >> "$GITHUB_ENV"
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home.py create
          git rev-parse HEAD
          go version
          bun --version

      # Acceptance criterion 3: vet compiles tests too; build alone does not.
      - name: Vet terminal-only packages
        if: matrix.goos == 'linux'
        timeout-minutes: 20
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: go vet -tags nogui ./...

      - name: Test terminal-only packages
        if: matrix.goos == 'linux'
        timeout-minutes: 60
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: go test -count=1 -timeout 45m -tags nogui ./...

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        if: matrix.goos == 'linux'
        with:
          node-version: 22
      - name: Test the site and installer
        timeout-minutes: 10
        if: matrix.goos == 'linux'
        run: |
          sh -n site/public/install.sh
          node --test site/*.test.mjs

      # On a step failure/cancellation, remove only the home created above.
      # A lost runner or job-level hard timeout may preempt cleanup/upload.
      - name: Clean isolated test home
        if: ${{ always() && steps.test_home.outputs.record != '' }}
        timeout-minutes: 2
        env:
          MAGPIE_CI_HOME_RECORD: ${{ steps.test_home.outputs.record }}
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" -I -B build/ci_home.py cleanup

      # Workflow logs remain available if a runner is lost before upload.
      # Only check output is retained, not homes, caches, or build products.
      - name: Preserve check logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magpie-ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7

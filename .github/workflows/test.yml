name: Test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.repository }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local
jobs:
  stream-budget-control:
    runs-on: macos-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c953886a7aed6a47499760f456df52f379846cf5
          path: subject
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: subject/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Same-source serial 75s and race-only 180s comparison
        working-directory: subject
        timeout-minutes: 55
        run: python3 -I -B ../control/build/stream-budget-control.py
      - name: Preserve both comparison logs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-budget-control-${{ github.run_id }}
          path: ${{ runner.temp }}/magpie-*.jsonl
          retention-days: 7
          if-no-files-found: error

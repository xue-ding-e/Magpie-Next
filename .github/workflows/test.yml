name: Magpie cancellation validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed control commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: test-${{ github.repository }}
  cancel-in-progress: false
jobs:
  cancellation:
    if: github.repository == 'xue-ding-e/Magpie-Next' && github.ref == 'refs/heads/validation/coordination-cancel-fixture-20261029'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Start shared verification budget
        run: python -c "import os,time; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('VALIDATION_START='+str(time.time())+'\n')"
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify controls and apply pinned candidate
        run: python -I -B .github/validation/magpie-lock.py prepare
      - uses: actions/setup-go@v5
        timeout-minutes: 2
        with:
          go-version-file: go.mod
          cache: true
      - name: Isolate synthetic home
        id: home
        run: |
          for name in GOPATH GOMODCACHE GOCACHE; do
            value=$(go env "$name")
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          python -I -B build/ci_home.py create
      - name: Exact native cancellation regressions
        id: tests
        timeout-minutes: 8
        run: python -I -B .github/validation/magpie-lock.py test
      - name: Remove recorded synthetic home
        if: always() && steps.home.outputs.record != '' && steps.tests.outputs.cleanup_permitted == 'true'
        env:
          MAGPIE_CI_HOME_RECORD: ${{ steps.home.outputs.record }}
        run: python -I -B build/ci_home.py cleanup
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancellation-${{ runner.os }}-${{ github.sha }}
          path: validation-evidence/
          if-no-files-found: error
          retention-days: 7
